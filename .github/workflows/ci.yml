name: Pull Request

on:
  push:
    branches:
      - main
      - dev
  pull_request: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede stale PR runs, but never cancel a push run: it may be deploying.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    name: ⬣ Biome
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠️ Typegen
        run: npm run typegen

      - name: 🔬 Lint
        run: npm run lint

  type-check:
    name: ʦ TypeScript
    runs-on: ubuntu-latest
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🔎 Type check
        run: npm run typecheck

  commitlint:
    name: ⚙️ commitlint
    runs-on: ubuntu-latest
    if: github.actor != 'dependabot[bot]'
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: ⚙️ commitlint
        uses: wagoid/commitlint-github-action@v6

  vitest:
    name: ⚡ Vitest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 10s
          --health-timeout 5s --health-retries 5
    steps:
      - name: ⬇️ Checkout repo
        uses: actions/checkout@v4

      - name: ⎔ Setup node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'

      - name: 📥 Install dependencies
        run: npm ci

      - name: 🏄 Copy test env vars
        run: cp .env.example .env

      - name: 🛠 Setup Database
        run: npm run prisma:wipe

      - name: 🛠️ Typegen
        run: npm run typegen

      - name: ⚡ Run vitest
        run: npm run test -- --coverage

  deploy:
    name: 🚀 Deploy
    # Pushes to dev deploy to https://collect-am.orololuwa.dev once the checks pass.
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    needs: [lint, type-check, vitest]
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

