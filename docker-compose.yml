services:
  db:
    image: postgres:17-alpine
    container_name: collect-am-db
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-app}
    ports:
      # Published on the host's loopback only (default 5433) so local dev
      # (`npm run dev`) and the Prisma CLI can reach it, but the internet can't:
      # Docker's port rules bypass host firewalls like UFW. Inside the compose
      # network it's still db:5432.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-off job that applies Prisma migrations before the app starts. Uses the
  # build stage of the Dockerfile because it has the Prisma CLI installed.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      target: build-env
    command: ["npx", "prisma", "migrate", "deploy"]
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: collect-am-app
    ports:
      # Loopback only, for checks from the host. The public way in is the
      # server's Caddy container, which reaches the app as collect-am-app:3001
      # over the shared `web` network.
      - "127.0.0.1:3001:3001"
    networks:
      - default
      - web
    env_file:
      - .env
    environment:
      # Everything else (secrets, Auth0, Stripe, ...) comes from .env. These
      # override it for the container:
      # Talks to the `db` service over the compose network.
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-app}

      # Node environment
      - NODE_ENV=production
      - PORT=3001

      # Puppeteer configuration (already set in Dockerfile, but can override)
      - PUPPETEER_SKIP_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Health check to ensure the app is running
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

volumes:
  pgdata:

networks:
  # Created by the server's Caddy setup. To run the app container locally, create
  # it once with `docker network create web`.
  web:
    external: true
